[package]
name = "pentactopus-desktop"
version = "1.0.0"
description = "Pentactopus: Autonomous Computer-Use Vision AI and Remote Desktop Mesh"
authors = ["Pentactopus Core Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
