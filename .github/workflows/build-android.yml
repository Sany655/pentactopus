name: Build Android APK (Standalone)

# This workflow is a standalone Android build — the main release pipeline
# is in build-clients.yml which also creates the GitHub Release.
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: ./penta-app
        run: npm install

      - name: Initialize Android Project
        working-directory: ./penta-app
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            cargo tauri android init --ci || echo "Init failed but continuing"
          fi
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Build Android APK
        working-directory: ./penta-app
        run: cargo tauri android build --apk
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Rename and Upload APK Artifact
        run: |
          APK=$(find penta-app/src-tauri/gen/android -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" PentaAssistant.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaAssistant-Android
          path: PentaAssistant.apk
