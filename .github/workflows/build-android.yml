name: Build Android APK (Standalone)

# This workflow is a standalone Android build — the main release pipeline
# is in build-clients.yml which also creates the GitHub Release.
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: penta-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-tauri CLI v2
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install Android NDK 25 via sdkmanager
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "platforms;android-33" \
            "build-tools;33.0.2"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install npm dependencies
        working-directory: ./penta-app
        run: npm ci

      - name: Build frontend
        working-directory: ./penta-app
        run: npm run build

      - name: Inject dummy sidecar stubs
        working-directory: ./penta-app
        run: |
          mkdir -p src-tauri/binaries
          for ARCH in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            touch "src-tauri/binaries/penta_daemon-$ARCH"
            chmod +x "src-tauri/binaries/penta_daemon-$ARCH"
          done

      - name: Initialize Tauri Android project
        working-directory: ./penta-app
        run: cargo tauri android init --ci
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build Android APK (debug, unsigned)
        working-directory: ./penta-app
        run: cargo tauri android build --apk --debug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Locate and copy APK
        id: find_apk
        run: |
          APK=$(find penta-app/src-tauri/gen/android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced by Tauri build!" && exit 1
          fi
          cp "$APK" PentaAssistant.apk
          ls -lh PentaAssistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaAssistant-Android
          path: PentaAssistant.apk
          retention-days: 30
