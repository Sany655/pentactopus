name: Build and Release Native Client Apps

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release regardless of commit message'
        type: boolean
        default: true
      version_override:
        description: 'Override release version (leave blank to read from tauri.conf.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  evaluate-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Evaluate Release Trigger
        id: check
        shell: bash
        run: |
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"
          IS_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          # Extract version from tauri.conf.json
          JSON_VERSION=$(node -e "try { console.log(require('./penta-app/src-tauri/tauri.conf.json').version); } catch(e){ console.log('2.7.1'); }")
          INPUT_VERSION="${{ inputs.version_override }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$IS_TAG" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$JSON_VERSION"
          fi
          
          TAG_NAME="v$VERSION"
          
          SHOULD_BUILD="false"
          if [ "$IS_TAG" = "true" ] || [ "$IS_DISPATCH" = "true" ]; then
            SHOULD_BUILD="true"
          elif echo "$COMMIT_MSG" | grep -Ei '\[release\]|\[auto-release\]|^release(\(.*\))?:' > /dev/null; then
            SHOULD_BUILD="true"
          fi
          
          echo "Decision: should_build=$SHOULD_BUILD, version=$VERSION, tag_name=$TAG_NAME"
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  build-windows:
    needs: evaluate-trigger
    if: needs.evaluate-trigger.outputs.should_build == 'true'
    runs-on: windows-latest
    outputs:
      exe_path: ${{ steps.find_exe.outputs.exe_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: penta-app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./penta-app
        run: npm ci

      - name: Build frontend
        working-directory: ./penta-app
        run: npm run build

      - name: Build Python Sidecar (penta_daemon)
        shell: powershell
        run: .\build_sidecar.ps1 -Target "x86_64-pc-windows-msvc"

      - name: Build Windows Tauri App
        working-directory: ./penta-app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find and rename installer
        id: find_exe
        shell: powershell
        run: |
          $exe = Get-ChildItem -Recurse -Path "penta-app/src-tauri/target/release/bundle" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Recurse -Path "penta-app/src-tauri/target/release/bundle" -Filter "*.msi" | Select-Object -First 1
          }
          Copy-Item $exe.FullName -Destination "PentaAssistant-Setup.exe"
          echo "exe_path=PentaAssistant-Setup.exe" >> $env:GITHUB_OUTPUT
          echo "Found: $($exe.FullName)"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaAssistant-Windows-Setup
          path: PentaAssistant-Setup.exe
          retention-days: 7

  build-android:
    needs: evaluate-trigger
    if: needs.evaluate-trigger.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: penta-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-tauri CLI v2
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install Android NDK 25 via sdkmanager
        run: |
          # Use pre-installed cmdline-tools (NOT android-actions/setup-android)
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Set Android Environment Variables
        run: |
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: ./penta-app
        run: npm ci

      - name: Initialize Tauri Android project if needed
        working-directory: ./penta-app
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Tauri Android target..."
            cargo tauri android init
          fi

      - name: Build frontend
        working-directory: ./penta-app
        run: npm run build

      - name: Ensure Android Sidecar Stubs
        working-directory: ./penta-app
        run: |
          mkdir -p src-tauri/binaries
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            if [ ! -f "src-tauri/binaries/penta_daemon-$target" ]; then
              printf '#!/bin/sh\nexit 0\n' > "src-tauri/binaries/penta_daemon-$target"
            fi
            chmod +x "src-tauri/binaries/penta_daemon-$target"
          done

      - name: Build Android APK
        working-directory: ./penta-app
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          cargo tauri android build --apk

      - name: Find generated APK
        id: find_apk
        run: |
          APK=$(find penta-app/src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced by Tauri build!" && exit 1
          fi
          cp "$APK" PentaAssistant.apk
          ls -lh PentaAssistant.apk
          echo "apk_path=PentaAssistant.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaAssistant-Android-APK
          path: PentaAssistant.apk
          retention-days: 30

  release:
    needs: [evaluate-trigger, build-windows, build-android]
    if: needs.evaluate-trigger.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PentaAssistant-Windows-Setup
          path: ./release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: PentaAssistant-Android-APK
          path: ./release-assets

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Create or update Git Tag
        env:
          TAG_NAME: ${{ needs.evaluate-trigger.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" -f || echo "Tag update skipped"

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.evaluate-trigger.outputs.tag_name }}
          name: "Pentactopus ${{ needs.evaluate-trigger.outputs.tag_name }}"
          body: |
            ## Pentactopus ${{ needs.evaluate-trigger.outputs.tag_name }}

            ### Downloads
            - **Windows**: `PentaAssistant-Setup.exe` — Windows 10/11 x64 installer
            - **Android**: `PentaAssistant.apk` — Android 8.0+ Universal APK

            ### What's New
            - Autonomous AI computer-use agent (vision + action loop)
            - Cross-platform P2P remote desktop mesh
            - Clean zero-residue install/uninstall architecture
            - Persistent server connection & login enhancements
            - License key activation & Pro tier
            - Improved performance and stability
          draft: false
          prerelease: false
          files: |
            ./release-assets/PentaAssistant-Setup.exe
            ./release-assets/PentaAssistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push binaries to public releases repo
        env:
          RELEASE_REPO_PAT: ${{ secrets.RELEASE_REPO_PAT }}
          TAG_NAME: ${{ needs.evaluate-trigger.outputs.tag_name }}
        run: |
          # Only run if the token is provided
          if [ -z "$RELEASE_REPO_PAT" ]; then
            echo "RELEASE_REPO_PAT secret is not set. Skipping push to public repository."
            exit 0
          fi
          
          # Setup git credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the public releases repository
          git clone "https://${RELEASE_REPO_PAT}@github.com/Sany655/pentactopus-releases.git" public-repo
          
          # Delete old binaries so they don't pile up in the repository
          cd public-repo
          git rm -q *.exe *.apk || true
          
          # Copy binaries with version tag and latest aliases
          cp ../release-assets/PentaAssistant-Setup.exe "PentaAssistant-Setup-${TAG_NAME}.exe"
          cp ../release-assets/PentaAssistant-Setup.exe "PentaAssistant-Setup.exe"
          cp ../release-assets/PentaAssistant.apk "PentaAssistant-${TAG_NAME}.apk"
          cp ../release-assets/PentaAssistant.apk "PentaAssistant.apk"
          
          # Commit and push
          git add .
          git commit -m "chore: automated binary release for ${TAG_NAME}" || echo "No changes to commit"
          git push origin main
