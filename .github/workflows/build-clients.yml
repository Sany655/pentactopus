name: Build and Release Native Client Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      exe_path: ${{ steps.find_exe.outputs.exe_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: penta-app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./penta-app
        run: npm ci

      - name: Build frontend
        working-directory: ./penta-app
        run: npm run build

      - name: Build Python Sidecar (penta_daemon)
        shell: powershell
        run: .\build_sidecar.ps1 -Target "x86_64-pc-windows-msvc"

      - name: Build Windows Tauri App
        working-directory: ./penta-app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find and rename installer
        id: find_exe
        shell: powershell
        run: |
          $exe = Get-ChildItem -Recurse -Path "penta-app/src-tauri/target/release/bundle" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Recurse -Path "penta-app/src-tauri/target/release/bundle" -Filter "*.msi" | Select-Object -First 1
          }
          Copy-Item $exe.FullName -Destination "PentaAssistant-Setup.exe"
          echo "exe_path=PentaAssistant-Setup.exe" >> $env:GITHUB_OUTPUT
          echo "Found: $($exe.FullName)"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaAssistant-Windows-Setup
          path: PentaAssistant-Setup.exe
          retention-days: 7

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: penta-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-tauri CLI v2
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install Android NDK 25 via sdkmanager
        run: |
          # Use pre-installed cmdline-tools (NOT android-actions/setup-android)
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "platforms;android-33" \
            "build-tools;33.0.2"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install npm dependencies
        working-directory: ./penta-app
        run: npm ci

      - name: Build frontend
        working-directory: ./penta-app
        run: npm run build

      - name: Inject dummy sidecar stubs
        working-directory: ./penta-app
        run: |
          mkdir -p src-tauri/binaries
          for ARCH in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            touch "src-tauri/binaries/penta_daemon-$ARCH"
            chmod +x "src-tauri/binaries/penta_daemon-$ARCH"
          done

      - name: Initialize Tauri Android project
        working-directory: ./penta-app
        run: cargo tauri android init --ci
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build Android APK (debug, unsigned)
        working-directory: ./penta-app
        run: cargo tauri android build --apk --debug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Locate and copy APK
        id: find_apk
        run: |
          APK=$(find penta-app/src-tauri/gen/android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced by Tauri build!" && exit 1
          fi
          cp "$APK" PentaAssistant.apk
          ls -lh PentaAssistant.apk
          echo "apk_path=PentaAssistant.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaAssistant-Android-APK
          path: PentaAssistant.apk
          retention-days: 30

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PentaAssistant-Windows-Setup
          path: ./release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: PentaAssistant-Android-APK
          path: ./release-assets

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: "Pentactopus ${{ github.ref_name == 'main' && 'Latest' || github.ref_name }}"
          body: |
            ## Pentactopus ${{ github.ref_name }}

            ### Downloads
            - **Windows**: `PentaAssistant-Setup.exe` — Windows 10/11 x64 installer
            - **Android**: `PentaAssistant.apk` — Android 8.0+ Universal APK

            ### What's New
            - Autonomous AI computer-use agent (vision + action loop)
            - Cross-platform P2P remote desktop mesh
            - License key activation & Pro tier
            - Improved performance and stability
          draft: false
          prerelease: false
          files: |
            ./release-assets/PentaAssistant-Setup.exe
            ./release-assets/PentaAssistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push binaries to public releases repo
        env:
          RELEASE_REPO_PAT: ${{ secrets.RELEASE_REPO_PAT }}
        run: |
          # Only run if the token is provided
          if [ -z "$RELEASE_REPO_PAT" ]; then
            echo "RELEASE_REPO_PAT secret is not set. Skipping push to public repository."
            exit 0
          fi
          
          # Setup git credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the public releases repository
          git clone "https://${RELEASE_REPO_PAT}@github.com/Sany655/pentactopus-releases.git" public-repo
          
          # Delete old binaries so they don't pile up in the repository
          cd public-repo
          git rm -q *.exe *.apk || true
          
          # Copy and rename the compiled binaries into the repository with versioning
          cp ../release-assets/PentaAssistant-Setup.exe PentaAssistant-Setup-${{ github.ref_name == 'main' && 'latest' || github.ref_name }}.exe
          cp ../release-assets/PentaAssistant.apk PentaAssistant-${{ github.ref_name == 'main' && 'latest' || github.ref_name }}.apk
          
          # Commit and push
          git add .
          git commit -m "chore: automated versioned binary release for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
