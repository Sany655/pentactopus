name: Build and Release Native Client Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: penta-app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./penta-app
        run: npm ci

      - name: Build frontend
        working-directory: ./penta-app
        run: npm run build

      - name: Build Windows Tauri App
        working-directory: ./penta-app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaAssistant-Windows-Setup
          path: penta-app/src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Install npm dependencies
        working-directory: ./penta-app
        run: npm ci

      - name: Build Android APK
        working-directory: ./penta-app
        run: cargo tauri android build --apk
        continue-on-error: true

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaAssistant-Android-APK
          path: penta-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
